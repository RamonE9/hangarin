<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            opacity: 0.8;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            background: white;
            color: #2a5298;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon"></div>
        <h1>You’re Offline</h1>
        <p>Please check your internet connection</p>
        <a href="/" class="btn">Retry</a>
    </div>
</body>
</html>
