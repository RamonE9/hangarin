{% extends "base.html" %}

{% block title %}Create Project — Hangarin{% endblock %}
{% block nav_projects %}active{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 0 auto;">
    <div class="glass-card animate-fade-in" style="padding: 40px;">
        <div style="margin-bottom: 32px;">
            <a href="{% url 'project_list' %}" class="btn btn--ghost btn--sm" style="margin-bottom: 16px; display: inline-flex; align-items: center; gap: 6px;">
                <i class="fas fa-arrow-left"></i> Back to Projects
            </a>
            <h1 style="font-size: 1.5rem; margin-bottom: 4px;"><i class="fas fa-folder-plus" style="margin-right: 8px; color: var(--accent-primary);"></i>Create New Project</h1>
            <p style="color: var(--text-muted); margin: 0;">Fill in the details below</p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Project Name</label>
                <input type="text" name="name" class="form-input" placeholder="E.g., Website Redesign" required>
            </div>
            <div class="form-group">
                <label class="form-label">Description (Optional)</label>
                <textarea name="description" class="form-input" placeholder="What is this project about?" rows="4"></textarea>
            </div>
            <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
                <a href="{% url 'project_list' %}" class="btn btn--ghost">Cancel</a>
                <button type="submit" class="btn btn--primary btn--lg">Create Project</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
